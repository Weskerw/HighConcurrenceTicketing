
services:
  # Database Relazionale per la persistenza finale
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    environment:
      POSTGRES_DB: ticketing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Cache in-memory + Redlock per la gestione atomica dei posti
  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Message Broker asincrono per disaccoppiare API e Worker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ticketing-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Dashboard (UI)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  postgres_data:
  redis_data: